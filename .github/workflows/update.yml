name: Update Events

on:
  schedule:
    - cron: "0 20 * * *"  # JST 05:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-bot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Run updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Tokyo
        run: python -m src.main
      - name: Commit and push changes
        env:
          TZ: Asia/Tokyo
        run: |
          if git diff --quiet --exit-code; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "fablio-dev"
          git config user.email "dev@fablio.jp"
          git add events.csv README.md
          git commit -m "[Bot] イベント情報を自動更新しました"
          git push
